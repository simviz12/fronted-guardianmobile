<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-surface": "#0b1c30", "on-secondary-fixed": "#0d1d2b", "tertiary-fixed-dim": "#ffb3ad", "on-tertiary": "#ffffff", "primary-container": "#00855c", "surface-variant": "#d3e4fe", "inverse-on-surface": "#eaf1ff", "on-primary-container": "#f5fff7", "outline": "#6d7a72", "on-secondary": "#ffffff", "on-error": "#ffffff", "surface": "#f8f9ff", "tertiary-container": "#da3437", "on-background": "#0b1c30", "primary-fixed": "#82f9c2", "outline-variant": "#bccac0", "surface-bright": "#f8f9ff", "secondary-fixed": "#d4e4f8", "on-primary": "#ffffff", "on-tertiary-fixed": "#410004", "on-secondary-container": "#576677", "error-container": "#ffdad6", "tertiary": "#b61722", "surface-container-high": "#dce9ff", "on-error-container": "#93000a", "primary": "#006948", "surface-tint": "#006c4a", "on-tertiary-container": "#fffbff", "surface-dim": "#cbdbf5", "surface-container-lowest": "#ffffff", "primary-fixed-dim": "#65dca8", "secondary-fixed-dim": "#b8c8db", "secondary": "#516071", "on-secondary-fixed-variant": "#394858", "tertiary-fixed": "#ffdad7", "surface-container-highest": "#d3e4fe", "inverse-surface": "#213145", "on-primary-fixed": "#002114", "inverse-primary": "#65dca8", "secondary-container": "#d4e4f8", "on-tertiary-fixed-variant": "#930013", "on-primary-fixed-variant": "#005237", "surface-container-low": "#eff4ff", "error": "#ba1a1a", "on-surface-variant": "#3d4a42", "background": "#f8f9ff", "surface-container": "#e5eeff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "0.5rem", "margin-mobile": "1rem", "gutter": "1.5rem", "gutter-mobile": "1rem", "space-xl": "2rem", "margin": "2rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-2xl": "3rem", "space-md": "1rem" }, fontFamily: { "headline-xl": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "caption-technical": ["Plus Jakarta Sans"], "headline-lg-mobile": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"] }, fontSize: { "headline-xl": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }], "headline-sm": ["16px", { lineHeight: "24px", fontWeight: "600" }], "label-md": ["14px", { lineHeight: "20px", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-md": ["20px", { lineHeight: "28px", fontWeight: "600" }], "headline-xl-mobile": ["28px", { lineHeight: "36px", letterSpacing: "-0.01em", fontWeight: "700" }], "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "600" }], "caption-technical": ["11px", { lineHeight: "14px", letterSpacing: "0.02em", fontWeight: "500" }], "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }], "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.015em", fontWeight: "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface-variant flex flex-col min-h-screen antialiased pt-safe pb-safe"><main class="flex-1 w-full bg-surface min-h-screen flex flex-col"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">
<!-- Subtle Trust Header -->
<div class="flex flex-col items-center pt-space-md pb-space-lg">
<div class="w-16 h-16 rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-center p-2 mb-space-md">
<img alt="Guardian Mobile Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1WWgSEOh9op6GkIMKPdkw__PFMUd7hrFbhc4ndtriNhyoMpRF4PcLwJEPxaOb5JNUj_xaELj_CT2sJoq1RhI0LIPxNCIEH4vfa9CYswxxjZ27mpr4o5aEPdk5FfW_11jdwuDvF8kURK1uF7Wmm5PeFj1RWZwIRHIHTBdpcqJFm0uOsSbTrXuScC4xRJm6evg2EXqfSMGWSWjgutnwHZkFD-oUTVrXT2xnGMWPhWEHR83erXBAxPpYb8"/>
</div>
<!-- Shield Aura Icon -->
<div class="relative flex items-center justify-center mb-space-md">
<div class="absolute w-20 h-20 rounded-full bg-primary-fixed opacity-40 animate-pulse"></div>
<div class="relative w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
<!-- Headline and Subtitle -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mb-space-xs">
      Acceso Seguro
    </h1>
<p class="font-body-md text-body-md text-secondary text-center max-w-xs">
      Ingresa tus credenciales para gestionar y localizar tus dispositivos protegidos
    </p>
</div>
<!-- Main Security Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-space-lg flex flex-col space-y-space-md">
<!-- Email Field -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="email-input">
        Correo electrónico institucional o personal
      </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">mail</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-low text-on-surface placeholder:text-secondary rounded-lg font-body-md text-body-md focus:outline-none focus:bg-surface-container transition-colors" id="email-input" inputmode="email" placeholder="usuario@guardianmobile.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-sm text-label-sm text-on-surface" for="password-input">
        Contraseña maestra
      </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">key</span>
<input class="w-full h-12 pl-11 pr-12 bg-surface-container-low text-on-surface placeholder:text-secondary rounded-lg font-body-md text-body-md focus:outline-none focus:bg-surface-container transition-colors" id="password-input" placeholder="••••••••••••" type="password"/>
<button aria-label="Alternar visibilidad de contraseña" class="absolute right-3.5 text-secondary hover:text-on-surface p-1 rounded-full flex items-center justify-center transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
<div class="flex justify-end pt-1">
<a class="font-label-sm text-label-sm text-secondary hover:text-on-surface transition-colors" href="#recovery">
          ¿Olvidaste tu contraseña o perdiste el acceso?
        </a>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-space-xs flex flex-col space-y-space-sm">
<button class="w-full h-12 bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center space-x-space-xs shadow-sm active:opacity-90 transition-opacity" id="btn-login" type="button">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
<span>Iniciar Sesión Segura</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Biometric Option -->
<button class="w-full h-12 bg-surface-container-low text-on-surface rounded-lg font-label-md text-label-md flex items-center justify-center space-x-space-xs hover:bg-surface-container active:scale-[0.99] transition-all" id="btn-biometrics" type="button">
<span class="material-symbols-outlined text-primary text-[22px]">fingerprint</span>
<span>Acceder con Face ID / Huella digital</span>
</button>
</div>
</div>
<!-- Device Protection Badge Note -->
<div class="mt-space-md mx-auto inline-flex items-center space-x-space-xs px-space-md py-space-xs rounded-full bg-surface-container-low">
<span class="material-symbols-outlined text-primary text-[16px]" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-sm text-label-sm text-on-surface">Canal seguro de autenticación remota</span>
</div>
<!-- Security Footer & Telemetry Health -->
<div class="mt-space-xl pt-space-md flex flex-col items-center justify-center text-center space-y-space-xs">
<div class="flex items-center space-x-2">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</span>
<span class="font-caption-technical text-caption-technical text-secondary uppercase tracking-wider">
        Estado del servidor: Operativo (99.9%)
      </span>
</div>
<p class="font-caption-technical text-caption-technical text-secondary">
      Protegido con cifrado punto a punto AES-256
    </p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password-input');
    const toggleBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const biometricsBtn = document.getElementById('btn-biometrics');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (biometricsBtn) {
      biometricsBtn.addEventListener('click', function() {
        const originalText = biometricsBtn.innerHTML;
        biometricsBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px] text-primary">sync</span><span class="font-label-md text-label-md text-on-surface">Escaneando biometría...</span>';
        setTimeout(function() {
          biometricsBtn.innerHTML = originalText;
        }, 1800);
      });
    }
  })();
</script></main></body></html>
